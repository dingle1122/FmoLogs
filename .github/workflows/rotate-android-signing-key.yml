name: Rotate Android Signing Key

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/rotate-android-signing-key.yml"

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Restore old keystore
        env:
          OLD_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$OLD_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/old.jks"
          chmod 600 "$RUNNER_TEMP/old.jks"

      - name: Generate new keystore
        env:
          NEW_STORE_PASSWORD: ${{ secrets.NEW_KEYSTORE_PASSWORD }}
          NEW_KEY_PASSWORD: ${{ secrets.NEW_KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -storetype JKS \
            -keystore "$RUNNER_TEMP/new.jks" \
            -storepass "$NEW_STORE_PASSWORD" \
            -alias new-signing-key \
            -keypass "$NEW_KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=FmoLogs Android Release, O=FmoLogs, C=CN"

      - name: Find apksigner
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

      - name: Create signing lineage
        env:
          OLD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OLD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OLD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NEW_STORE_PASSWORD: ${{ secrets.NEW_KEYSTORE_PASSWORD }}
          NEW_KEY_PASSWORD: ${{ secrets.NEW_KEY_PASSWORD }}
        run: |
          "$APKSIGNER" rotate \
            --out "$RUNNER_TEMP/signing-lineage.bin" \
            --old-signer \
            --ks "$RUNNER_TEMP/old.jks" \
            --ks-key-alias "$OLD_KEY_ALIAS" \
            --ks-pass env:OLD_STORE_PASSWORD \
            --key-pass env:OLD_KEY_PASSWORD \
            --new-signer \
            --ks "$RUNNER_TEMP/new.jks" \
            --ks-key-alias new-signing-key \
            --ks-pass env:NEW_STORE_PASSWORD \
            --key-pass env:NEW_KEY_PASSWORD

      - name: Encrypt result
        env:
          EXPORT_PASSWORD: ${{ secrets.KEY_EXPORT_PASSWORD }}
        run: |
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/android-signing.tar.gz" \
            new.jks signing-lineage.bin

          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/android-signing.tar.gz" \
            -out "$RUNNER_TEMP/android-signing.tar.gz.enc" \
            -pass env:EXPORT_PASSWORD

      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-key-rotation
          path: ${{ runner.temp }}/android-signing.tar.gz.enc
          retention-days: 1
