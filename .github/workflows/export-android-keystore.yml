name: Export Android Keystore

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/export-android-keystore.yml"

permissions:
  contents: read

concurrency:
  group: export-android-keystore
  cancel-in-progress: false

jobs:
  export:
    name: Export encrypted signing backup
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPORT_PASSWORD: ${{ secrets.KEY_EXPORT_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ANDROID_KEYSTORE_PASSWORD is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ANDROID_KEY_ALIAS is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ANDROID_KEY_PASSWORD is missing"
            exit 1
          }

          test -n "$EXPORT_PASSWORD" || {
            echo "KEY_EXPORT_PASSWORD is missing"
            exit 1
          }

      - name: Restore original signing data
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BACKUP_DIR="$RUNNER_TEMP/android-signing-backup"
          mkdir -p "$BACKUP_DIR"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$BACKUP_DIR/keystore.jks"

          printf '%s' "$KEYSTORE_PASSWORD" \
            > "$BACKUP_DIR/keystore-password.txt"

          printf '%s' "$KEY_ALIAS" \
            > "$BACKUP_DIR/key-alias.txt"

          printf '%s' "$KEY_PASSWORD" \
            > "$BACKUP_DIR/key-password.txt"

          chmod 700 "$BACKUP_DIR"
          chmod 600 "$BACKUP_DIR/"*

      - name: Verify original keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore "$RUNNER_TEMP/android-signing-backup/keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Original keystore verified successfully"

      - name: Create encrypted archive
        env:
          EXPORT_PASSWORD: ${{ secrets.KEY_EXPORT_PASSWORD }}
        run: |
          set -euo pipefail

          PLAIN_ARCHIVE="$RUNNER_TEMP/android-signing-backup.tar.gz"
          ENCRYPTED_ARCHIVE="$RUNNER_TEMP/android-signing-backup.tar.gz.enc"

          tar \
            -C "$RUNNER_TEMP" \
            -czf "$PLAIN_ARCHIVE" \
            android-signing-backup

          openssl enc \
            -aes-256-cbc \
            -pbkdf2 \
            -salt \
            -in "$PLAIN_ARCHIVE" \
            -out "$ENCRYPTED_ARCHIVE" \
            -pass env:EXPORT_PASSWORD

          chmod 600 "$ENCRYPTED_ARCHIVE"

          test -s "$ENCRYPTED_ARCHIVE" || {
            echo "Encrypted archive was not created"
            exit 1
          }

          echo "Encrypted signing backup created successfully"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-backup
          path: ${{ runner.temp }}/android-signing-backup.tar.gz.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0